<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>bw-quickaccess</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section id="unlock-screen" class="screen">
      <h1>bw-quickaccess</h1>
      <form id="unlock-form">
        <input
          id="master-password"
          type="password"
          placeholder="マスターパスワード"
          data-i18n-placeholder="masterPasswordPlaceholder"
          autocomplete="current-password"
        />
        <button type="submit" data-i18n="unlockButton">アンロック</button>
        <div id="unlock-error"></div>
      </form>
    </section>

    <section id="search-screen" class="screen">
      <input id="search-box" type="text" placeholder="検索..." data-i18n-placeholder="searchPlaceholder" autocomplete="off" />
      <ul id="results"></ul>
      <div id="empty-message" data-i18n="emptyMessage">アイテムが見つかりません</div>
      <div id="help-overlay">
        <h2 data-i18n="helpTitle">ショートカット</h2>
        <dl>
          <div>
            <dt><kbd>⇧⌘Space</kbd></dt>
            <dd data-i18n="helpTogglePopup">クイックアクセスを表示/非表示</dd>
          </div>
          <div>
            <dt><kbd>↑</kbd> / <kbd>↓</kbd></dt>
            <dd data-i18n="helpMoveFocus">アイテム間を移動</dd>
          </div>
          <div>
            <dt><kbd>→</kbd></dt>
            <dd data-i18n="helpOpenMenu">アクションメニューを開く</dd>
          </div>
          <div>
            <dt><kbd>←</kbd></dt>
            <dd data-i18n="helpCloseMenu">アクションメニューを閉じる</dd>
          </div>
          <div>
            <dt><kbd>⌘C</kbd></dt>
            <dd data-i18n="helpCopyUsername">ユーザー名をコピー</dd>
          </div>
          <div>
            <dt><kbd>⇧⌘C</kbd></dt>
            <dd data-i18n="helpCopyPassword">パスワードをコピー</dd>
          </div>
          <div>
            <dt><kbd>⌥⌘C</kbd></dt>
            <dd data-i18n="helpCopyTotp">ワンタイムパスワードをコピー</dd>
          </div>
          <div>
            <dt><kbd>Enter</kbd></dt>
            <dd data-i18n="helpOpenBrowser">ブラウザで開く</dd>
          </div>
          <div>
            <dt><kbd>Esc</kbd></dt>
            <dd data-i18n="helpClose">閉じる</dd>
          </div>
          <div>
            <dt><kbd>⌘/</kbd></dt>
            <dd data-i18n="helpToggleHelp">このヘルプを表示/非表示</dd>
          </div>
        </dl>
      </div>
    </section>

    <script src="i18n.js"></script>
    <script src="app.js"></script>
  </body>
</html>
