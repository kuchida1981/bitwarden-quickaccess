[package]
name = "bw-quickaccess-gui"
version = "0.1.0"
description = "Menu-bar Quick Access GUI for Bitwarden (bw serve backend)"
edition = "2021"

[lib]
name = "bw_quickaccess_gui_lib"
path = "src/lib.rs"

[[bin]]
name = "bw-quickaccess-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "net", "io-util", "signal"] }
thiserror = "1"
sys-locale = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
