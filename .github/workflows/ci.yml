name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bats-core and shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core shellcheck

      - name: Install bats-core (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Syntax check (bash -n)
        run: |
          bash -n bin/bw-quickaccess
          for f in lib/*.sh; do
            bash -n "$f"
          done

      - name: shellcheck (production code)
        run: shellcheck -x bin/bw-quickaccess

      - name: shellcheck (test code)
        run: shellcheck test/helpers/*.bash test/lib/*.bats

      - name: Run bats tests
        run: bats test/lib/*.bats
