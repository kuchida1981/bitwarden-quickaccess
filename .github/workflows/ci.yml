name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # bats のテスト名に日本語(マルチバイト文字)を使っているため、ロケールが
      # UTF-8 でないと "unknown test name" で全テストが実行されずに失敗する
      # (macos-latest ランナーで実際に発生を確認)。明示的に UTF-8 ロケールを指定する。
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bats-core and shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core shellcheck

      - name: Install bats-core (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Syntax check (bash -n)
        run: |
          bash -n bin/bw-quickaccess
          for f in lib/*.sh; do
            bash -n "$f"
          done

      - name: shellcheck (production code)
        run: shellcheck -x bin/bw-quickaccess

      - name: shellcheck (test code)
        run: shellcheck test/helpers/*.bash test/lib/*.bats

      - name: Debug locale and bats version
        run: |
          locale
          bats --version
          echo "LANG=$LANG LC_ALL=$LC_ALL"
          echo "--- bash ---"
          command -v bash
          bash --version | head -1
          head -1 "$(command -v bats)"
          echo "--- env bash ---"
          command -v env
          /usr/bin/env bash --version | head -1

      - name: Run bats tests
        run: bats test/lib/*.bats
