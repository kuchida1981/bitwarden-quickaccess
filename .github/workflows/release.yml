name: Release Packaging

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build bundle
        run: |
          VERSION="${{ github.event.release.tag_name }}" script/build.sh

      - name: Smoke test
        run: |
          dist/bw-quickaccess --version
          dist/bw-quickaccess --help

      - name: Syntax check (bash -n)
        run: |
          bash -n dist/bw-quickaccess

      - name: shellcheck
        run: |
          shellcheck -x dist/bw-quickaccess

      - name: Upload bundle to release
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/bw-quickaccess --clobber
        env:
          GH_TOKEN: ${{ github.token }}
